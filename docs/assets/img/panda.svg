<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Calm Panda Sensei mascot">
  <!-- Ears -->
  <circle cx="35" cy="35" r="16" fill="#1f2937" />
  <circle cx="85" cy="35" r="16" fill="#1f2937" />
  <circle cx="35" cy="35" r="8" fill="#374151" />
  <circle cx="85" cy="35" r="8" fill="#374151" />

  <!-- Head -->
  <circle cx="60" cy="65" r="42" fill="#ffffff" stroke="#1f2937" stroke-width="4" />

  <!-- Eye Patches -->
  <ellipse cx="44" cy="62" rx="12" ry="15" fill="#1f2937" transform="rotate(-15 44 62)" />
  <ellipse cx="76" cy="62" rx="12" ry="15" fill="#1f2937" transform="rotate(15 76 62)" />

  <!-- Calm Closed Eyes (Zen / Meditative Smile) -->
  <path d="M 37 63 Q 44 57 51 63" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round" />
  <path d="M 69 63 Q 76 57 83 63" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round" />

  <!-- Nose -->
  <polygon points="56,72 64,72 60,77" fill="#1f2937" />

  <!-- Calm Gentle Smile -->
  <path d="M 54 80 Q 60 86 66 80" stroke="#1f2937" stroke-width="2.5" fill="none" stroke-linecap="round" />

  <!-- Martial Arts Headband (Hachimaki) -->
  <path d="M 18 48 Q 60 40 102 48" stroke="#dc2626" stroke-width="7" fill="none" stroke-linecap="round" />
  <!-- Headband knot on side -->
  <circle cx="100" cy="50" r="5" fill="#dc2626" />
  <path d="M 100 52 L 108 64" stroke="#dc2626" stroke-width="4" stroke-linecap="round" />
  <path d="M 98 54 L 104 68" stroke="#dc2626" stroke-width="3" stroke-linecap="round" />
</svg>
